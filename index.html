<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Biblia</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Biblia">
<meta name="theme-color" content="#5b1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cálida, sencilla, invita sin presionar; una app para todos los días
   IDEA: el calendario de pared de la iglesia — cada día un cuadro que se pinta
   PICTURE: el calendario del mes, grande, con verdes y rojos
   COLOUR and TYPE: vino profundo, oro de amanecer, blanco papel; Outfit + Lora para la Palabra
   LAYOUT: encabezado vino con saludo y racha, calendario, luego el día abierto en hoja */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#140910);--ink:light-dark(#241319,#f5ecee);--soft:light-dark(#f7f1f2,#21121a);--line:light-dark(#eadfe2,#36202b);--muted:light-dark(#6f5a61,#b9a3ab);--w:#5b1530;--w2:#7a1c3a;--gold:#f2b84b;--ok:#1f9d55;--bad:#d64545;--part:#e9a23b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Outfit,system-ui,sans-serif;overflow-x:clip}
button{font:600 16px Outfit,sans-serif;cursor:pointer;border:0;border-radius:14px;min-height:48px}
input,select{font:16px Outfit,sans-serif;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);min-height:50px;width:100%;max-width:100%;display:block}
input[type=time]{-webkit-appearance:none;appearance:none;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.primary{background:var(--w);color:#fff;width:100%}
.ghost{background:var(--soft);color:var(--ink);border:1.5px solid var(--line);padding:0 16px}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 max(5vw,16px)}
/* Bienvenida */
#welcome{min-height:100vh;background:linear-gradient(180deg,var(--w2),#3a0a1e);color:#fff;display:grid;align-content:center;padding:max(env(safe-area-inset-top),24px) 0 32px;padding-top:max(env(safe-area-inset-top),72px)}
#welcome img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:block;margin:0 auto 18px}
#welcome h1{font:800 40px/1.05 Outfit;text-align:center;margin:0}
#welcome p.sub{text-align:center;color:#f3d9e0;margin:8px 0 26px}
.card{background:var(--bg);color:var(--ink);border-radius:22px;padding:22px;display:grid;gap:14px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{background:var(--soft);border:1.5px solid var(--line);color:var(--ink);padding:10px 6px;display:grid;gap:2px;line-height:1.2}
.lv b{font-size:22px}.lv span{font-size:12px;color:var(--muted)}
.lv[aria-pressed=true]{background:var(--w);border-color:var(--w);color:#fff}.lv[aria-pressed=true] span{color:#f3d9e0}
.times{display:grid;gap:8px}
.err{color:var(--bad);font-size:14px;min-height:20px}
/* Encabezado */
header{background:linear-gradient(180deg,var(--w2),var(--w));color:#fff;padding:max(env(safe-area-inset-top),18px) 0 22px}
.hrow{display:flex;align-items:center;gap:12px}
.hrow img{width:44px;height:44px;border-radius:12px}
.hrow h1{font:800 22px Outfit;margin:0;flex:1}
.hrow button{min-height:44px;background:rgba(255,255,255,.14);color:#fff;padding:0 14px}
.hello{font-size:15px;color:#f3d9e0;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.stats b{display:block;font:800 24px Outfit;color:var(--gold)}
.stats span{font-size:13px;color:#f3d9e0}
/* Calendario */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.mhead h2{font:800 22px Outfit;margin:0}
.mhead button{width:44px;padding:0;font-size:22px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow span{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.grid{margin-top:6px}
.day{aspect-ratio:1;border-radius:12px;font:600 17px Outfit;display:grid;place-items:center;padding:0;min-height:0;background:var(--soft);color:var(--muted);border:2px solid transparent;position:relative}
.day.ok{background:var(--ok);color:#fff}
.day.bad{background:var(--bad);color:#fff}
.day.part{background:var(--part);color:#2a1600}
.day.today{border-color:var(--gold);color:var(--ink)}
.day.today.ok,.day.today.part{color:#fff}
.day.fut{opacity:.45;cursor:default}
.day.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--w)}
:root[data-theme=dark] .day.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
/* Día */
#dayView{margin:26px 0 40px}
#dayView h3{font:800 20px Outfit;margin:0 0 12px}
.slot{background:var(--soft);border-radius:18px;padding:16px;margin-bottom:12px;border:1.5px solid var(--line)}
.slot .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot .t b{font-size:16px}.slot .t small{color:var(--muted);white-space:nowrap}
.slot button{margin-top:12px;width:100%}
.verse{font:italic 500 20px/1.5 Lora,Georgia,serif;margin:14px 0 6px}
.ref{font:600 14px Outfit;color:var(--w)}:root[data-theme=dark] .ref{color:var(--gold)}
.refl{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line);font-size:15px}
.refl b{color:var(--muted);font-size:13px;display:block}
.done{color:var(--ok);font-weight:600;font-size:14px}
.locked{color:var(--muted);font-size:14px;margin-top:10px}
.reveal{animation:up .45s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
.note{font-size:13px;color:var(--muted);text-align:center;margin:30px 0}
/* Ajustes */
#settings{position:fixed;inset:0;background:rgba(20,5,12,.55);display:grid;align-items:end;z-index:9}
#settings .card{border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding-bottom:max(env(safe-area-inset-bottom),22px)}
#settings h2{margin:0;font:800 22px Outfit}
</style>
</head>
<body>

<!-- BIENVENIDA / REGISTRO -->
<section id="welcome" class="hidden">
  <div class="wrap">
    <img src="icon-192.png" alt="Logo de Mi Biblia">
    <h1>Mi Biblia</h1>
    <p class="sub">Un versículo a la vez. Todos los días.</p>
    <form class="card" id="regForm">
      <label>Tu nombre<input id="rName" autocomplete="given-name" required placeholder="Ej. Edwin"></label>
      <label>Número de celular<input id="rPhone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="Ej. 5555 1234"></label>
      <div>
        <label style="margin-bottom:8px">¿Cuántos versículos quieres al día?</label>
        <div class="levels" id="rLevels"></div>
      </div>
      <div class="times" id="rTimes"></div>
      <div class="err" id="rErr" role="alert"></div>
      <button class="primary" type="submit">Comenzar</button>
    </form>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="hrow"><img src="icon-192.png" alt=""><h1>Mi Biblia</h1><button id="openSet" type="button">Ajustes</button></div>
      <div class="hello" id="hello"></div>
      <div class="stats">
        <div><b id="sStreak">0</b><span>días seguidos</span></div>
        <div><b id="sMonth">0</b><span>días leídos este mes</span></div>
        <div><b id="sTotal">0</b><span>versículos leídos</span></div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="mhead"><button class="ghost" id="prev" type="button" aria-label="Mes anterior">‹</button><h2 id="mTitle"></h2><button class="ghost" id="next" type="button" aria-label="Mes siguiente">›</button></div>
    <div class="dow"><span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Leído</span><span><i style="background:var(--part)"></i>A medias</span><span><i style="background:var(--bad)"></i>No leído</span><span><i style="border:2px solid var(--gold)"></i>Hoy</span></div>
    <section id="dayView"></section>
    <p class="note">Textos bíblicos: Reina-Valera 1909 (dominio público), con ortografía actualizada.</p>
  </main>
</section>

<!-- AJUSTES -->
<div id="settings" class="hidden" role="dialog" aria-modal="true" aria-labelledby="setT">
  <form class="card" id="setForm">
    <h2 id="setT">Ajustes</h2>
    <label>Nombre<input id="sName" required></label>
    <label>Celular<input id="sPhone" type="tel" inputmode="tel" required></label>
    <div><label style="margin-bottom:8px">Versículos al día</label><div class="levels" id="sLevels"></div></div>
    <div class="times" id="sTimes"></div>
    <button class="primary" type="submit">Guardar</button>
    <button class="ghost" type="button" id="closeSet">Cancelar</button>
  </form>
</div>

<script>
{
const V = [

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem = {};
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ?? d); } catch { return mem[k] ?? d; } };
const store = (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const fmtHM = t => { let [h,m] = t.split(':').map(Number); const ap = h < 12 ? 'a. m.' : 'p. m.'; h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };

let user = load('mb-user', null);      // {name, phone, times:[...]}
let reads = load('mb-reads', {});      // {'2026-11-25': [0,2]}  índices de versículo leídos
let view = new Date(); view.setDate(1);
let sel = iso(new Date());

function verseFor(dateStr, slot) {
  const d = fromIso(dateStr);
  const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  return V[((d.getFullYear() * 7 + doy) * 3 + slot) % V.length];
}
function status(dateStr) {
  const today = iso(new Date());
  if (dateStr > today) return 'fut';
  const n = (reads[dateStr] || []).length, need = user.times.length;
  if (n >= need) return 'ok';
  if (n > 0) return 'part';
  return dateStr === today || dateStr < (user.since || '') ? '' : 'bad';
}

/* ---------- Selector de nivel y horarios (registro y ajustes) ---------- */
function levelUI(levelsEl, timesEl, times) {
  let cur = times.slice();
  const draw = () => {
    levelsEl.innerHTML = LEVELS.map(l => `<button type="button" class="lv" data-n="${l.n}" aria-pressed="${cur.length === l.n}"><b>${l.n}</b>${l.name}<span>${l.n === 1 ? 'versículo' : 'versículos'}</span></button>`).join('');
    timesEl.innerHTML = cur.map((t, i) => `<label>${SLOTNAME(t)} · versículo ${i+1}<input type="time" data-i="${i}" value="${t}" required></label>`).join('');
  };
  levelsEl.onclick = e => { const b = e.target.closest('.lv'); if (!b) return; const n = +b.dataset.n; cur = LEVELS[n-1].times.map((t, i) => cur[i] && cur.length >= n ? cur[i] : t); draw(); };
  timesEl.oninput = e => { if (e.target.dataset.i) cur[+e.target.dataset.i] = e.target.value; };
  draw();
  return () => cur.slice().sort();
}

/* ---------- Registro ---------- */
function showWelcome() {
  $('welcome').classList.remove('hidden'); $('app').classList.add('hidden');
  const getTimes = levelUI($('rLevels'), $('rTimes'), LEVELS[0].times);
  $('regForm').onsubmit = e => {
    e.preventDefault();
    const name = $('rName').value.trim(), phone = $('rPhone').value.replace(/[^\d+]/g, '');
    if (name.length < 2) return $('rErr').textContent = 'Escribe tu nombre.';
    if (phone.replace(/\D/g, '').length < 8) return $('rErr').textContent = 'El celular debe tener al menos 8 dígitos.';
    user = { name, phone, times: getTimes(), since: iso(new Date()) };
    store('mb-user', user);
    showApp();
  };
}

/* ---------- App ---------- */
function showApp() {
  $('welcome').classList.add('hidden'); $('app').classList.remove('hidden');
  const h = new Date().getHours();
  $('hello').textContent = `${h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches'}, ${user.name}. Toca el día de hoy para leer.`;
  render();
}
function stats() {
  let streak = 0; const d = new Date();
  if (status(iso(d)) !== 'ok') d.setDate(d.getDate() - 1);
  while (status(iso(d)) === 'ok') { streak++; d.setDate(d.getDate() - 1); }
  const mk = iso(new Date()).slice(0, 7);
  $('sStreak').textContent = streak;
  $('sMonth').textContent = Object.keys(reads).filter(k => k.startsWith(mk) && reads[k].length).length;
  $('sTotal').textContent = Object.values(reads).reduce((s, a) => s + a.length, 0);
}
function render() {
  stats();
  const y = view.getFullYear(), m = view.getMonth();
  const mt = view.toLocaleDateString('es-GT', { month: 'long' }); $('mTitle').textContent = mt.charAt(0).toUpperCase() + mt.slice(1) + ' ' + y;
  const days = new Date(y, m + 1, 0).getDate();      // 28, 29, 30 o 31 según el mes
  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // semana inicia lunes
  const today = iso(new Date());
  let html = '<span></span>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const s = iso(new Date(y, m, d)), st = status(s);
    html += `<button type="button" class="day ${st} ${s === today ? 'today' : ''} ${s === sel ? 'sel' : ''}" data-d="${s}" ${st === 'fut' ? 'aria-disabled="true"' : ''} aria-label="${d}">${d}</button>`;
  }
  $('grid').innerHTML = html;
  renderDay();
}
function renderDay() {
  const today = iso(new Date()), isToday = sel === today, done = reads[sel] || [];
  const title = isToday ? 'Hoy, ' + fromIso(sel).toLocaleDateString('es-GT', { weekday: 'long', day: 'numeric', month: 'long' })
                        : fromIso(sel).toLocaleDateString('es-GT', { weekday: 'long', day: 'numeric', month: 'long' });
  const now = nowHM();
  $('dayView').innerHTML = `<h3>${esc(title.charAt(0).toUpperCase() + title.slice(1))}</h3>` + user.times.map((t, i) => {
    const [ref, txt, refl] = verseFor(sel, i);
    const isRead = done.includes(i), open = !isToday || now >= t;
    const head = `<div class="t"><b>${SLOTNAME(t)}</b><small>${fmtHM(t)}</small></div>`;
    if (isRead) return `<div class="slot">${head}<p class="verse">“${esc(txt)}”</p><div class="ref">${esc(ref)}</div><div class="refl"><b>Reflexión</b>${esc(refl)}</div><p class="done">✓ Leído</p></div>`;
    if (!open) return `<div class="slot">${head}<p class="locked">Tu versículo se abre a las ${fmtHM(t)}</p></div>`;
    return `<div class="slot">${head}<button class="primary" type="button" data-read="${i}">Leer versículo ${i+1}</button></div>`;
  }).join('');
}

$('grid').addEventListener('click', e => {
  const b = e.target.closest('.day'); if (!b || b.classList.contains('fut')) return;
  sel = b.dataset.d; render();
  $('dayView').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
});
$('dayView').addEventListener('click', e => {
  const b = e.target.closest('[data-read]'); if (!b) return;
  const i = +b.dataset.read;
  reads[sel] = [...new Set([...(reads[sel] || []), i])];
  store('mb-reads', reads);
  render();
  const slot = $('dayView').querySelectorAll('.slot')[i]; if (slot) slot.classList.add('reveal');
});
$('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

/* ---------- Ajustes ---------- */
let getSetTimes;
$('openSet').onclick = () => {
  $('sName').value = user.name; $('sPhone').value = user.phone;
  getSetTimes = levelUI($('sLevels'), $('sTimes'), user.times);
  $('settings').classList.remove('hidden');
};
$('closeSet').onclick = () => $('settings').classList.add('hidden');
$('setForm').onsubmit = e => {
  e.preventDefault();
  user = { ...user, name: $('sName').value.trim() || user.name, phone: $('sPhone').value.trim() || user.phone, times: getSetTimes() };
  store('mb-user', user);
  $('settings').classList.add('hidden');
  showApp();
};

// Se refresca cada minuto para abrir el versículo cuando llega su hora
setInterval(() => { if (user && !$('app').classList.contains('hidden')) render(); }, 60000);

try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}

user ? showApp() : showWelcome();
}
</script>
</body>
</html>
